name: Release Assets

on:
  push:
    branches:
      - main
    paths:
      - 'src/assets/skills/**'
      - 'src/assets/pets/**'
      - 'src/assets/icons/**'
      - 'src/assets/backgrounds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-assets:
    name: Upload Media Assets to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="assets-v1"
          NOTES="Automated release containing pet ability cinematic MP4s, pet evolution PNGs, pet icons, and pet backgrounds."
          echo "Checking if release $TAG exists..."
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            if gh release view "skill-assets-v1" > /dev/null 2>&1; then
              echo "Migrating skill-assets-v1 to $TAG..."
              gh release edit "skill-assets-v1" --tag "$TAG" --title "Release Assets v1" --notes "$NOTES" || \
              gh release create "$TAG" --title "Release Assets v1" --notes "$NOTES"
            else
              echo "Release $TAG does not exist. Creating release..."
              gh release create "$TAG" \
                --title "Release Assets v1" \
                --notes "$NOTES"
            fi
          else
            echo "Release $TAG already exists."
          fi

          echo "Uploading media assets..."
          gh release upload "$TAG" \
            src/assets/skills/*.mp4 \
            src/assets/pets/*.png \
            src/assets/icons/* \
            src/assets/backgrounds/* \
            --clobber

