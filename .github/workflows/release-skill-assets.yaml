name: Release Skill Video Assets

on:
  push:
    branches:
      - main
    paths:
      - 'src/assets/skills/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-skill-assets:
    name: Upload Skill Video Assets to GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update release and upload videos
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="skill-assets-v1"
          echo "Checking if release $TAG exists..."
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG does not exist. Creating release..."
            gh release create "$TAG" \
              --title "Skill Video Assets v1" \
              --notes "Automated release containing Pet ability cinematic MP4 media assets."
          else
            echo "Release $TAG already exists."
          fi

          echo "Uploading skill video MP4 files..."
          gh release upload "$TAG" src/assets/skills/*.mp4 --clobber

